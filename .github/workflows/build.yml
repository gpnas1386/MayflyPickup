name: build-ios
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen ldid || true
      - name: Generate
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project MayflyPickup.xcodeproj -scheme MayflyPickup \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO build 2>&1 | tee build/build.log | tail -70
      - name: Package
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/MayflyPickup.app
          ls -la "$APP" || true
          ldid -SSources/App/App.entitlements "$APP/MayflyPickup" || true
          for ext in "$APP"/PlugIns/*.appex; do
            [ -d "$ext" ] || continue
            n=$(basename "$ext" .appex)
            ldid -SSources/Widget/Widget.entitlements "$ext/$n" || true
          done
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry MayflyPickup-1.3.0.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MayflyPickup-ipa
          path: build/MayflyPickup-1.3.0.ipa
      - name: Log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
