name: MayflyPickup
options:
  bundleIdPrefix: com.agent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MayflyPickup:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/App
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agent.idcode
        INFOPLIST_FILE: Sources/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
    dependencies:
      - target: MayflyWidgetExtension
        embed: true
  MayflyWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agent.idcode.widget
        INFOPLIST_FILE: Sources/Widget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
schemes:
  MayflyPickup:
    build:
      targets:
        MayflyPickup: all
    run:
      config: Debug
    archive:
      config: Release
